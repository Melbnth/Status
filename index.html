<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Work Status Sidebar</title>

<style>
:root{
    --free:#2ecc71;
    --busy:#f1c40f;
    --coffee:#3498db;
    --urgent:#e67e22;
    --dnd:#e74c3c;

    --dark:#111111;
    --light:#ffffff;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    height:100%;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}

body{
    background:var(--free);
    color:var(--dark);

    display:flex;
    flex-direction:column;

    overflow:hidden;

    transition:
        background-color .3s ease,
        color .3s ease;
}

/* ==================================================
   MAIN STATUS AREA
   ================================================== */

.display-panel{
    flex:1;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;

    padding:20px;

    transition:all .3s ease;
}

#current-status-text{
    font-size:2.4rem;
    font-weight:800;
    line-height:1.1;
    text-transform:uppercase;
    word-break:break-word;
}

#custom-message-display{
    margin-top:12px;

    font-size:1.1rem;
    font-style:italic;

    opacity:.95;

    max-width:90%;
    word-wrap:break-word;
}

#timer-display{
    margin-top:16px;

    display:none;

    font-family:Consolas,Monaco,monospace;
    font-size:1.15rem;
    font-weight:700;

    padding:6px 12px;

    border-radius:6px;

    background:rgba(0,0,0,.15);
}

/* ==================================================
   CONTROLS DRAWER
   ================================================== */

details{
    flex-shrink:0;

    background:#111111;
    color:#ffffff;

    border-top:2px solid rgba(255,255,255,.1);

    box-shadow:
        0 -8px 20px rgba(0,0,0,.35);
}

summary{
    cursor:pointer;

    user-select:none;

    text-align:center;

    font-size:.85rem;
    font-weight:700;

    padding:10px;

    list-style:none;

    opacity:.85;
}

summary::-webkit-details-marker{
    display:none;
}

.tray-content{
    display:flex;
    flex-direction:column;
    gap:10px;

    padding:12px;
}

/* ==================================================
   STATUS BUTTONS
   ================================================== */

.status-btn{
    background:transparent;

    padding:12px;

    font-size:.95rem;
    font-weight:700;

    text-align:left;

    border-radius:8px;

    cursor:pointer;

    transition:.2s;
}

.status-btn:hover{
    transform:translateY(-1px);
}

.status-btn:active{
    transform:scale(.98);
}

.btn-free{
    border:2px solid var(--free);
    color:var(--free);
}

.btn-free:hover{
    background:rgba(46,204,113,.15);
}

.btn-busy{
    border:2px solid var(--busy);
    color:var(--busy);
}

.btn-busy:hover{
    background:rgba(241,196,15,.15);
}

.btn-coffee{
    border:2px solid var(--coffee);
    color:var(--coffee);
}

.btn-coffee:hover{
    background:rgba(52,152,219,.15);
}

.btn-urgent{
    border:2px solid var(--urgent);
    color:var(--urgent);
}

.btn-urgent:hover{
    background:rgba(230,126,34,.15);
}

.btn-dnd{
    border:2px solid var(--dnd);
    color:var(--dnd);
}

.btn-dnd:hover{
    background:rgba(231,76,60,.15);
}

/* ==================================================
   INPUTS
   ================================================== */

.input-group{
    display:flex;
    flex-direction:column;
    gap:5px;
}

label{
    font-size:.8rem;
    color:#cccccc;
}

input,
select{
    width:100%;

    padding:8px;

    font-size:.9rem;

    border-radius:6px;

    border:1px solid #444;

    background:#222;
    color:#fff;
}

input:focus,
select:focus{
    outline:none;
    border-color:#888;
}

@media(max-width:400px){

    #current-status-text{
        font-size:2rem;
    }

}
</style>
</head>
<body>

<div class="display-panel">

    <div id="current-status-text">
        FREE / AVAILABLE
    </div>

    <div id="custom-message-display">
        No custom note set
    </div>

    <div id="timer-display">
        00:00
    </div>

</div>

<!-- COLLAPSED BY DEFAULT -->
<details id="controlTray">

    <summary id="traySummary">
        ▲ Click to Show Controls
    </summary>

    <div class="tray-content">

        <button
            class="status-btn btn-free"
            onclick="setStatus('Free / Available','#2ecc71','#111111')">
            ○ Free / Available
        </button>

        <button
            class="status-btn btn-busy"
            onclick="setStatus('Busy / In Meeting','#f1c40f','#111111')">
            ○ Busy / In Meeting
        </button>

        <button
            class="status-btn btn-coffee"
            onclick="setStatus('Busy, but coffee? ☕','#3498db','#ffffff')">
            ○ Busy, but coffee? ☕
        </button>

        <button
            class="status-btn btn-urgent"
            onclick="setStatus('Urgent Only','#e67e22','#111111')">
            ○ Urgent Only
        </button>

        <button
            class="status-btn btn-dnd"
            onclick="setStatus('Do Not Disturb','#e74c3c','#ffffff')">
            ○ Do Not Disturb
        </button>

        <div class="input-group">
            <label for="custom-msg">Status Note</label>
            <input
                id="custom-msg"
                type="text"
                placeholder="Type a note..."
                oninput="updateMessage()">
        </div>

        <div class="input-group">
            <label for="timer-select">
                Auto-Reset Timer
            </label>

            <select id="timer-select">
                <option value="0">No Timer</option>
                <option value="5">5 Minutes</option>
                <option value="15">15 Minutes</option>
                <option value="30">30 Minutes</option>
                <option value="60">1 Hour</option>
            </select>
        </div>

    </div>

</details>

<script>

let countdownInterval;

/* =====================================
   DRAWER TEXT
   ===================================== */

const tray = document.getElementById("controlTray");
const traySummary = document.getElementById("traySummary");

function updateTrayText(){

    traySummary.textContent =
        tray.open
        ? "▼ Click to Hide Controls"
        : "▲ Click to Show Controls";

}

tray.addEventListener("toggle", updateTrayText);
updateTrayText();


/* =====================================
   STATUS NOTE
   ===================================== */

function updateMessage(){

    const value =
        document
            .getElementById("custom-msg")
            .value
            .trim();

    document
        .getElementById("custom-message-display")
        .textContent =
        value || "No custom note set";

    localStorage.setItem(
        "statusNote",
        value
    );

}


/* =====================================
   STATUS FUNCTIONS
   ===================================== */

function setStatus(name,bgColor,textColor,startTimer=true){

    document.body.style.backgroundColor =
        bgColor;

    document.body.style.color =
        textColor;

    document.getElementById(
        "current-status-text"
    ).textContent =
        name.toUpperCase();

    document.getElementById(
        "current-status-text"
    ).style.color =
        textColor;

    document.getElementById(
        "custom-message-display"
    ).style.color =
        textColor;

    document.getElementById(
        "timer-display"
    ).style.color =
        textColor;

    localStorage.setItem(
        "status",
        name
    );

    localStorage.setItem(
        "bgColor",
        bgColor
    );

    localStorage.setItem(
        "textColor",
        textColor
    );

    clearInterval(countdownInterval);

    const timerDisplay =
        document.getElementById(
            "timer-display"
        );

    timerDisplay.style.display =
        "none";

    if(!startTimer){
        return;
    }

    const mins =
        parseInt(
            document.getElementById(
                "timer-select"
            ).value
        );

    if(mins > 0){

        let remaining =
            mins * 60;

        const endTime =
            Date.now() +
            (remaining * 1000);

        localStorage.setItem(
            "timerEnd",
            endTime
        );

        timerDisplay.style.display =
            "block";

        updateTimer(remaining);

        countdownInterval =
            setInterval(() => {

                remaining =
                    Math.floor(
                        (
                            endTime -
                            Date.now()
                        ) / 1000
                    );

                if(remaining <= 0){

                    resetStatus();
                    return;

                }

                updateTimer(
                    remaining
                );

            },1000);

    }
    else{

        localStorage.removeItem(
            "timerEnd"
        );

    }

}


/* =====================================
   TIMER
   ===================================== */

function updateTimer(seconds){

    const mins =
        Math.floor(seconds / 60)
        .toString()
        .padStart(2,"0");

    const secs =
        (seconds % 60)
        .toString()
        .padStart(2,"0");

    document.getElementById(
        "timer-display"
    ).textContent =
        mins + ":" + secs;

}


function resetStatus(){

    clearInterval(
        countdownInterval
    );

    localStorage.removeItem(
        "timerEnd"
    );

    localStorage.removeItem(
        "statusNote"
    );

    document.getElementById(
        "custom-msg"
    ).value = "";

    updateMessage();

    document.getElementById(
        "timer-display"
    ).style.display =
        "none";

    setStatus(
        "Free / Available",
        "#2ecc71",
        "#111111",
        false
    );

}


/* =====================================
   LOAD SAVED STATUS
   ===================================== */

window.addEventListener(
    "load",
    () => {

    const note =
        localStorage.getItem(
            "statusNote"
        ) || "";

    document.getElementById(
        "custom-msg"
    ).value =
        note;

    updateMessage();

    const status =
        localStorage.getItem(
            "status"
        );

    const bgColor =
        localStorage.getItem(
            "bgColor"
        );

    const textColor =
        localStorage.getItem(
            "textColor"
        );

    if(
        status &&
        bgColor &&
        textColor
    ){

        setStatus(
            status,
            bgColor,
            textColor,
            false
        );

    }

    const timerEnd =
        Number(
            localStorage.getItem(
                "timerEnd"
            )
        );

    if(timerEnd){

        let remaining =
            Math.floor(
                (
                    timerEnd -
                    Date.now()
                ) / 1000
            );

        if(remaining > 0){

            document.getElementById(
                "timer-display"
            ).style.display =
                "block";

            updateTimer(
                remaining
            );

            countdownInterval =
                setInterval(
                    () => {

                    remaining =
                        Math.floor(
                            (
                                timerEnd -
                                Date.now()
                            ) / 1000
                        );

                    if(
                        remaining <= 0
                    ){

                        resetStatus();
                        return;

                    }

                    updateTimer(
                        remaining
                    );

                },1000);

        }
        else{

            resetStatus();

        }
    }

});
</script>

</body>
</html>
